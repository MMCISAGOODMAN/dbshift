environments:
  dev:
    url: jdbc:mysql://localhost:3306/app_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    user: root
    password: ${DB_PASSWORD:root}
    # dialect: mysql   # 可选：mysql, mariadb, postgresql, h2, sqlite, sqlserver, oracle, generic
  staging:
    url: jdbc:postgresql://localhost:5432/app_staging
    user: app
    password: ${DB_PASSWORD:secret}
    schema: public
  prod:
    url: jdbc:mysql://localhost:3306/app_prod?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    user: migrate_user
    password: ${PROD_DB_PASSWORD:changeme}

migrations:
  dir: ./example/db/migrations

rollback:
  dir: ./example/db/rollback

placeholders:
  schema: public

baselineOnMigrate: false
baselineVersion: "1"
outOfOrder: false

# 集成到 Java 项目时开启：应用启动自动执行 pending 迁移
autoMigrate:
  enabled: false
  environment: ${DBSHIFT_ENV:dev}
  initOnStartup: true
  failOnError: true
  appliedBy: app
  requireConfirmForProd: true
